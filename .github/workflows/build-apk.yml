name: Build Loony Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web Assets (Loony Hub)
        run: |
          npm install
          npm run build
          mkdir -p android-app/app/src/main/assets/public
          cp -r dist/* android-app/app/src/main/assets/public/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload Loony-Android.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loony-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
